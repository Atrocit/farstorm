name: Tests + Linting
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  linting:
    runs-on: ubuntu-latest
    env:
      NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: 'pnpm'
          cache-dependency-path: ./pnpm-lock.yaml
      - name: Install Modules
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Linting
        run: pnpm lint

  tests:
    runs-on: ubuntu-latest
    env:
      NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: pg
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: farstorm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: 'pnpm'
          cache-dependency-path: ./pnpm-lock.yaml
      - name: Install Modules
        run: pnpm install --frozen-lockfile
      - name: Run Tests with Coverage
        run: pnpm test:coverage
        env:
          BASEURL: http://localhost:3000
          DB_HOST: localhost
          DB_NAME: farstorm
          DB_PASSWORD: pg
          DB_USERNAME: pg
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
